name: Cloud Scraper Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件與 Playwright
        run: |
          python -m pip install --upgrade pip
          # 🔑 鎖定 playwright-stealth 版本為 1.0.6，完美支援 stealth_sync
          pip install requests playwright playwright-stealth==1.0.6
          playwright install chromium

      - name: 執行爬蟲程式
        run: python scraper.py
